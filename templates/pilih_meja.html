<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Meja - Restoran Ayam Jeze</title>
    <style>
        body {
            background: linear-gradient(135deg, #8B0000 0%, #4B0000 100%);
            color: #FFF8E1;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            padding-top: 50px;
        }

        .title-box {
            background: rgba(75, 0, 0, 0.95);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 25px 40px;
            margin: 0 auto 30px;
            display: inline-block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        
        .title-box h1 {
            color: #FFD700;
            font-size: 42px;
            margin: 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }
        
        .title-box p {
            color: #FFA500;
            font-size: 18px;
            margin: 8px 0 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid-meja {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 25px;
            margin-bottom: 60px;
        }

        .meja-btn {
            display: block;
            padding: 40px 20px;
            background: rgba(75, 0, 0, 0.9);
            border: 3px solid #FFD700;
            border-radius: 15px;
            color: #FFD700;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s;
        }

        .meja-btn:hover {
            background: #FFD700;
            color: #8B0000;
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.5);
        }

        .admin-link {
            text-align: center;
            margin-top: 60px;
            padding-bottom: 40px;
        }

        .admin-link a {
            color: #FFD700;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .admin-link a:hover {
            text-decoration: underline;
            color: #FFA500;
        }

        @media (max-width: 768px) {
            .grid-meja {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            .title-box h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
<!-- BINTIK REMPAH BERGERAK -->
<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; 
background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><circle cx=%2210%22 cy=%2210%22 r=%222%22 fill=%22rgba(255,215,0,0.4)%22/><circle cx=%2230%22 cy=%2230%22 r=%221.5%22 fill=%22rgba(255,165,0,0.3)%22/></svg>'); 
background-repeat: repeat;
animation: debuRempah 60s linear infinite;"></div>

<style>
@keyframes debuRempah {
    0% { background-position: 0px 0px; }
    100% { background-position: 400px 400px; }
}
</style>
    <header>
        <div class="title-box">
            <h1>🍗 Restoran Ayam Jeze</h1>
            <p>Silakan Pilih Meja Anda</p>
        </div>
    </header>

    <div class="container">
        <div class="grid-meja">
            {% for i in range(1, 11) %}
            <a href="/meja/{{ i }}" class="meja-btn">Meja {{ i }}</a>
            {% endfor %}
        </div>

        <div class="admin-link">
            <a href="/login">Login Admin</a>
        </div>
    </div>
    <!-- MASKOT BESAR POJOK KAN BAWAH -->
<img src="{{ url_for('static', filename='uploads/maskot.png') }}" 
     style="position: fixed; bottom: 40px; right: 40px; width: 280px; height: auto; opacity: 0.9; z-index: 9999; pointer-events: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.7));"
     alt="Maskot Ayam Jeze">
</body>
</html>
</body>
</html>
