<!DOCTYPE html>
<html>
<head>
    <title>Order Meja {{ nomor_meja }} - Restoran Ayam Jeze</title>
    <style>
        body{background:linear-gradient(135deg,#8B0000 0%,#4B0000 100%);color:#FFF8E1;font-family:Georgia;margin:0;padding:0;}
        header{background:rgba(75,0,0,0.95);padding:25px;border-bottom:3px solid #FFD700;text-align:center;}
        h1{color:#FFD700;margin:0;font-size:36px;}
       .nomor-meja{color:#FFA500;font-size:24px;margin-top:5px;}
       .container{max-width:1000px;margin:40px auto;padding:0 20px;}
      .order-box{background:rgba(75,0,0,0.9);padding:40px;border-radius:20px;border:3px solid #FFD700;margin-bottom:40px;}
        label{display:block;text-align:left;margin:15px 0 5px;color:#FFD700;font-weight:700;}
        input,select{width:100%;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#2a0000;color:#FFF8E1;font-size:16px;box-sizing:border-box;}
        button{width:100%;padding:16px;margin-top:25px;background:linear-gradient(135deg,#FFD700 0%,#FFA500 100%);color:#8B0000;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;}
        button:hover{transform:scale(1.02);}
        h2{color:#FFD700;text-align:center;font-size:32px;}
      .menu-item{display:flex;align-items:center;gap:15px;background:rgba(42,0,0,0.8);padding:15px;border-radius:12px;margin-bottom:12px;border:2px solid #FFD700;}
      .menu-item img{width:80px;height:80px;object-fit:cover;border-radius:10px;}
      .menu-info{flex:1;text-align:left;}
      .menu-info h4{margin:0;color:#FFD700;}
      .menu-info p{margin:5px 0;color:#FFA500;}
      .jumlah-input{width:80px;padding:8px;border:2px solid #FFD700;background:#2a0000;color:#FFF8E1;border-radius:8px;text-align:center;font-size:16px;}
      .back{margin-top:30px;text-align:center;}
      .back a{color:#FFD700;text-decoration:none;font-size:18px;}
    </style>
</head>
<body>
    <header>
        <h1>🍗Restoran Ayam Jeze</h1>
        <p class="nomor-meja">Meja {{ nomor_meja }}</p>
    </header>

    <div class="container">
        <div class="order-box">
            <h2>Pilih Menu</h2>
            <form method="POST" action="/pesan">
                <input type="hidden" name="nomor_meja" value="{{ nomor_meja }}">

                <label>Nama Pemesan</label>
                <input type="text" name="nama" placeholder="Masukkan nama Anda" required>

                <label>Pilih Menu & Jumlah</label>
                {% for m in menus %}
                <div class="menu-item">
                    <img src="{{ url_for('static', filename='uploads/' + m.foto) }}" alt="{{ m.nama }}">
                    <div class="menu-info">
                        <h4>{{ m.nama }}</h4>
                        <p>Rp {{ "{:,}".format(m.harga) }} - {{ m.deskripsi }}</p>
                    </div>
                    <input type="hidden" name="menu_id[]" value="{{ m.id }}">
                    <input type="number" name="jumlah[]" value="0" min="0" max="20" class="jumlah-input">
                </div>
                {% endfor %}

                <label>Metode Pembayaran</label>
                <select name="metode_bayar" required>
                    <option value="Cash">Cash</option>
                    <option value="QRIS">QRIS</option>
                </select>

                <button type="submit">Kirim Pesanan</button>
            </form>
        </div>

        <div class="back">
            <a href="/">← Ganti Meja</a>
        </div>
    </div>
    <!-- MASKOT BESAR POJOK KAN BAWAH -->
<img src="{{ url_for('static', filename='uploads/maskot.png') }}" 
     style="position: fixed; bottom: 40px; right: 40px; width: 280px; height: auto; opacity: 0.9; z-index: 9999; pointer-events: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.7));"
     alt="Maskot Ayam Jeze">
</body>
</html>
</body>
</html>
